<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autocomplete Word Web</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    background:
      radial-gradient(900px 420px at 50% 22%, rgba(37, 99, 235, 0.22), transparent 70%),
      #070d1f;
  }
  .card { background: rgba(20, 33, 74, 0.55); border: 1px solid rgba(148, 163, 184, 0.16);
          box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45); backdrop-filter: blur(14px); }
  /* search box: subtle border idle, gradient glow border on focus */
  .shell { border: 2px solid transparent;
           background: linear-gradient(#0e1a3f, #0e1a3f) padding-box, linear-gradient(90deg, rgba(148,163,184,.25), rgba(148,163,184,.25)) border-box;
           transition: box-shadow .2s; }
  .shell:focus-within { background: linear-gradient(#0e1a3f, #0e1a3f) padding-box, linear-gradient(90deg, #38bdf8, #818cf8) border-box;
           box-shadow: 0 0 28px rgba(99, 102, 241, 0.35); }
  .dropdown { background: rgba(12, 22, 52, 0.85); border: 1px solid rgba(148, 163, 184, 0.16); }
  .row { display: flex; align-items: center; gap: 16px; padding: 10px 20px; border-radius: 14px; cursor: pointer; }
  .row .ico { width: 40px; height: 40px; border-radius: 9999px; display: grid; place-items: center;
              background: rgba(30, 41, 90, 0.7); color: #cbd5e1; flex: none; }
  .row.active { background: rgba(37, 99, 235, 0.35); }
  .row.active .ico { background: rgba(37, 99, 235, 0.55); }
  .row .head { color: #fff; }
  .row .pre  { color: #7dd3fc; }
  .row .rest { color: #60a5fa; }
  .row.active .rest { color: #67e8f9; }
  .msg { padding: 18px 20px; color: rgba(203, 213, 225, 0.6); font-style: italic; }
</style>
</head>
<body class="min-h-screen text-slate-100 font-sans">

<!-- shared gradient for the icons -->
<svg width="0" height="0" class="absolute">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
</svg>

<!-- Top bar -->
<header class="h-[78px] border-b border-white/10 bg-slate-900/40 backdrop-blur flex items-center justify-between px-6 md:px-24">
  <div class="flex items-center gap-4">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="url(#g)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/>
      <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/>
      <path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/><path d="M12 18V5"/>
    </svg>
    <span class="text-xl tracking-wide text-slate-100">Autocomplete Word Web</span>
  </div>
  <div class="flex items-center gap-2 rounded-full bg-slate-800/70 border border-white/5 px-4 py-2 text-sm">
    <span id="statusDot" class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
    <span id="statusText">AI Suggest</span>
  </div>
</header>

<!-- Main card -->
<main class="flex justify-center px-4 pt-24 pb-16">
  <div class="card w-full max-w-[830px] rounded-[32px] p-10">

    <div class="flex items-center gap-6 mb-9">
      <svg width="48" height="48" viewBox="0 0 48 48">
        <path d="M20 6 C21.4 17 27 22.6 38 24 C27 25.4 21.4 31 20 42 C18.6 31 13 25.4 2 24 C13 22.6 18.6 17 20 6Z" fill="url(#g)"/>
        <path d="M39 4 C39.4 7 41 8.6 44 9 C41 9.4 39.4 11 39 14 C38.6 11 37 9.4 34 9 C37 8.6 38.6 7 39 4Z" fill="url(#g)"/>
        <path d="M38 33 C38.3 35.2 39.3 36.2 41.5 36.5 C39.3 36.8 38.3 37.8 38 40 C37.7 37.8 36.7 36.8 34.5 36.5 C36.7 36.2 37.7 35.2 38 33Z" fill="url(#g)" opacity=".8"/>
      </svg>
      <div>
        <h1 class="text-3xl font-medium text-white">Autocomplete Word Web</h1>
        <p class="text-slate-400 mt-1">Type a word and get smart suggestions</p>
      </div>
    </div>

    <!-- Search box -->
    <div class="shell rounded-[22px] flex items-center gap-4 px-6 h-[72px]">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="searchInput" type="text" autocomplete="off" autofocus spellcheck="false"
             placeholder="Type a word..."
             role="combobox" aria-expanded="false" aria-controls="list"
             class="flex-1 bg-transparent outline-none text-xl text-white placeholder-slate-500">
      <span id="tabHint" class="hidden rounded-lg bg-slate-700/50 px-3 py-1.5 text-sm text-slate-200">Tab ↵</span>
    </div>

    <!-- Suggestions dropdown -->
    <div id="dropdown" class="dropdown hidden mt-3 rounded-[22px] overflow-hidden">
      <ul id="list" role="listbox" class="p-2"></ul>
      <div class="flex items-center justify-between border-t border-white/10 px-5 py-4 text-sm text-slate-400">
        <span class="flex items-center gap-2">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="url(#g)"><path d="M12 2c.6 5.5 4.5 9.4 10 10-5.5.6-9.4 4.5-10 10-.6-5.5-4.5-9.4-10-10 5.5-.6 9.4-4.5 10-10Z"/></svg>
          Suggestions powered by word prediction
        </span>
        <button id="clearBtn" type="button" class="flex items-center gap-2 text-base text-slate-300 hover:text-white transition">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg>
          Clear
        </button>
      </div>
    </div>

  </div>
</main>

<script>
  const API = 'http://localhost:5000/api/search';
  const input = document.getElementById('searchInput');
  const dropdown = document.getElementById('dropdown');
  const list = document.getElementById('list');
  const tabHint = document.getElementById('tabHint');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');

  let debounceTimer;
  let requestId = 0;                         // ignore responses that arrive after the user kept typing
  let state = { head: '', items: [], active: 0 };

  // "amazing autom" -> head "amazing ", word "autom". Only `word` goes to the trie,
  // so every new word (after a space) starts again from the trie root.
  function splitInput(text) {
    const m = text.match(/^([\s\S]*\s)?(\S*)$/);
    return { head: m[1] || '', word: m[2] };
  }

  function setOnline(ok) {
    statusDot.className = 'w-2.5 h-2.5 rounded-full ' + (ok ? 'bg-emerald-400' : 'bg-red-400');
    statusText.textContent = ok ? 'AI Suggest' : 'Offline';
  }

  function hide() {
    clearTimeout(debounceTimer);
    requestId++;                              // invalidate any in-flight request
    state = { head: '', items: [], active: 0 };
    list.innerHTML = '';
    dropdown.classList.add('hidden');
    tabHint.classList.add('hidden');
    input.setAttribute('aria-expanded', 'false');
  }

  function showMessage(text) {
    list.innerHTML = '';
    const li = document.createElement('li');
    li.className = 'msg';
    li.textContent = text;
    list.appendChild(li);
    dropdown.classList.remove('hidden');
    tabHint.classList.add('hidden');
  }

  const SEARCH_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';

  function render(head, word, items) {
    state = { head, items, active: 0 };
    list.innerHTML = '';
    items.forEach((s, i) => {
      const li = document.createElement('li');
      li.className = 'row text-lg';
      li.setAttribute('role', 'option');
      li.innerHTML = '<span class="ico">' + SEARCH_ICON + '</span><span class="label"></span>';
      const label = li.querySelector('.label');
      // earlier words in white, typed part of the current word lighter, predicted rest in blue
      const parts = [['head', head], ['pre', s.slice(0, word.length)], ['rest', s.slice(word.length)]];
      parts.forEach(([cls, txt]) => {
        const span = document.createElement('span');
        span.className = cls;
        span.textContent = txt;
        label.appendChild(span);
      });
      li.addEventListener('mouseenter', () => setActive(i));
      li.addEventListener('mousedown', (e) => { e.preventDefault(); accept(i); }); // keep input focused
      list.appendChild(li);
    });
    dropdown.classList.remove('hidden');
    tabHint.classList.remove('hidden');
    input.setAttribute('aria-expanded', 'true');
    setActive(0);
  }

  function setActive(i) {
    state.active = i;
    [...list.children].forEach((li, idx) => li.classList.toggle('active', idx === i));
  }

  // Complete only the current word, keep earlier words, add a space, reset for the next word
  function accept(i) {
    const s = state.items[i];
    if (s == null) return;
    input.value = state.head + s + ' ';
    hide();
    input.focus();
  }

  input.addEventListener('input', () => {
    const { head, word } = splitInput(input.value);

    // empty box or a space just typed -> reset and wait for the next word
    if (word === '') { hide(); return; }

    clearTimeout(debounceTimer);
    const myId = ++requestId;

    debounceTimer = setTimeout(async () => {
      try {
        const res = await fetch(API + '?q=' + encodeURIComponent(word));
        const data = res.ok ? await res.json() : { results: [] };
        if (myId !== requestId) return;       // stale response
        setOnline(true);
        const items = data.results || [];
        if (items.length) render(head, word, items);
        else { state = { head, items: [], active: 0 }; showMessage('No matches for "' + word + '"'); }
      } catch (err) {
        if (myId !== requestId) return;
        console.error('Failed to fetch suggestions:', err);
        setOnline(false);
        showMessage('Cannot reach the server on localhost:5000. Is server.py running?');
      }
    }, 100);
  });

  input.addEventListener('keydown', (e) => {
    const n = state.items.length;
    if (!n) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); setActive((state.active + 1) % n); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setActive((state.active - 1 + n) % n); }
    else if (e.key === 'Tab' || e.key === 'Enter') { e.preventDefault(); accept(state.active); }
    else if (e.key === 'Escape') { hide(); }
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    input.value = '';
    hide();
    input.focus();
  });
</script>
</body>
</html>
